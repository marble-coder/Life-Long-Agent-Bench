group_size: 8  # how many attempts per sample before one GRPO update
accumulate_samples: 1  # 累积多少个样本后训练（设为4则每4个样本训练一次）
best_metric_strategy: best_reward  # options: best_reward (1 beats -1), best_reward_last (prefer latest among best)

generation:
  do_sample: true
  temperature: 0.8
  top_p: 0.95
  max_new_tokens: 512
  num_beams: 1

grpo:
  beta: 0.04                      # KL penalty 系数
  clip_param: 0.2                 # PPO clip range (epsilon)
  clip_ratio_c: 3.0               # dual-clip 上界（负优势时的额外裁剪，对齐 verl）
  kl_penalty_mode: "k3"           # KL 计算模式：k1, k2, k3(low_var_kl), abs
  loss_agg_mode: "token-mean"     # loss 聚合方式：token-mean, seq-mean-token-sum, seq-mean-token-mean
  reference_model_path: null      # optional: path to frozen reference model; null uses initial policy as reference

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: ["q_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

optim:
  learning_rate: 2.0e-6
  weight_decay: 0.01
  max_grad_norm: 1.0               # 梯度裁剪阈值（对齐 verl 默认值）
  num_train_epochs: 1              # 每个 group 训练的 epoch 数（每个 epoch 重新计算 new_log_prob）

save:
  lora_output_dir: "outputs/{TIMESTAMP}/grpo_rllm_lora"

# 新增：监控配置
monitoring:
  tensorboard: true  # 启用TensorBoard实时监控
  log_interval: 1  # 每步记录
  histogram_interval: 10  # 每10步记录分布（可选，当前未实现）
