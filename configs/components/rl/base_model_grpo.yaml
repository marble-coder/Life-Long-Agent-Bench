# Base Model GRPO Training Configuration
# 用于 Reflection GRPO 的内层训练（k2 rollouts per reflection）

# Model 配置
model_name_or_path: /mnt/ssd2/models/Meta-Llama-3.1-8B-Instruct
model_device: auto

# GRPO 配置
group_size: 4  # k2 = 4 (每个 reflection 对应 4 个 base model rollouts)
accumulate_samples: 2  # 累积多少个样本后训练
best_metric_strategy: best_reward  # best_reward | all_correct

# Generation 配置（采样生成）
generation:
  do_sample: true
  temperature: 0.7
  top_p: 0.9
  max_new_tokens: 2048

# GRPO 算法配置
grpo:
  beta: 0.04  # KL 惩罚系数
  clip_param: 0.2  # PPO clip 参数
  clip_ratio_c: 3.0  # dual-clip 参数
  kl_penalty_mode: k3  # KL 惩罚模式
  loss_agg_mode: token-mean  # loss 聚合模式

# LoRA 配置
lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

# 优化器配置
optim:
  learning_rate: 2e-5
  weight_decay: 0.0
  max_grad_norm: 1.0
  num_train_epochs: 1

# 保存配置
save:
  lora_output_dir: base_model_lora  # 相对于主 output 目录

# 监控配置
monitoring:
  tensorboard: true
