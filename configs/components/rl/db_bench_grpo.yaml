group_size: 4  # how many attempts per sample before one GRPO update
best_metric_strategy: best_reward  # options: best_reward (1 beats -1), best_reward_last (prefer latest among best)

generation:
  do_sample: true
  temperature: 1.0
  top_p: 0.95
  max_new_tokens: 512
  num_beams: 1
  # 固定采样
  # You can add other HF generation kwargs if needed.

grpo:
  beta: 0.04                      # KL penalty 系数
  clip_param: 0.2                 # PPO clip range (epsilon)
  clip_ratio_c: 3.0               # dual-clip 上界（负优势时的额外裁剪，对齐 verl）
  kl_penalty_mode: "k3"           # KL 计算模式：k1, k2, k3(low_var_kl), abs
  loss_agg_mode: "token-mean"     # loss 聚合方式：token-mean, seq-mean-token-sum, seq-mean-token-mean
  reference_model_path: "/mnt/ssd2/models/Meta-Llama-3.1-8B-Instruct"

lora:
  r: 64 #之前是16 32
  alpha: 128
  dropout: 0.05
  target_modules: ["q_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

optim:
  learning_rate: 2.0e-5 #之前是1e-6
  weight_decay: 0.01
  max_grad_norm: 1 #之前是100
  num_train_epochs: 1
  gradient_accumulation_steps: 1

save:
  lora_output_dir: "outputs/{TIMESTAMP}/grpo_lora"
