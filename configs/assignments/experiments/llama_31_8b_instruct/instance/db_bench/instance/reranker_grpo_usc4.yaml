import:
  - ../task.yaml
  - ../../../agent.yaml
  - ../../../../../../definition.yaml

assignment_config:
  callback_dict:
    callback_0:
      name: current_session_saving_callback
    callback_1:
      name: consecutive_abnormal_agent_inference_process_handling_callback
    callback_2:
      name: previous_sample_embedding_callback
      custom_parameters:
        utilized_sample_count: 4  # 最终选择 top4 轨迹
        max_cached_session_count: 500
        embedding_model_name: /mnt/ssd2/models/Qwen3-Embedding-4B
        embedding_device: cuda
        min_similarity: -100
        enable_memory_review: false
        store_failed_trajectories: false
        # ========== Rerank 配置（使用本地模型） ==========
        enable_rerank: true
        rerank_include_guidance: false
        rerank_use_local_model: true
        rerank_local_model_path: /mnt/ssd2/models/Qwen2.5-7B-Instruct
        rerank_local_model_device: "auto"
        rerank_local_do_sample: true  # 采样模式，每次rollout选择不同记忆
        rerank_local_temperature: 0.7  # 采样温度
        rerank_candidate_count: 16  # embedding 粗召回 top16
        rerank_include_trajectory: false  # 只用 query + reflection
        rerank_max_new_tokens: 512
        rerank_system_prompt: |
          You are an expert AI assistant specialized in selecting relevant historical examples for Text-to-SQL tasks.

          Your task is to:
          1. Analyze the current query and candidate historical trajectories
          2. Select the TOP-4 most relevant trajectories that will help solve the current task

          Focus on:
          - Semantic similarity between queries
          - SQL pattern applicability (JOINs, aggregations, subqueries, etc.)
          - Potential pitfalls to avoid based on past solutions
        rerank_user_prompt_template: |
          ### Current Task
          **Query:** {current_query}

          ### Candidate Historical Trajectories
          Below are {candidate_count} candidate trajectories. Select the TOP {top_k} most relevant ones.

          {candidates}

          ---

          ### Output Format
          Output a valid JSON object:

          ```json
          {{{{
            "selected_indices": [<your selected indices here>],
            "reasoning": "Brief explanation...",
            "guidance": "How to apply these examples..."
          }}}}
          ```

          **IMPORTANT:** `selected_indices` must contain exactly {top_k} numbers (1-indexed).
        # ========== Reflection 配置 ==========
        enable_reflection: true
        reflection_use_local_model: true
        reflection_local_model_path: /mnt/ssd2/models/Meta-Llama-3.1-8B-Instruct
        reflection_local_model_device: "auto"
        reflection_local_do_sample: false
        reflection_max_new_tokens: 1024
        reflection_system_prompt: |
          You are an expert AI Agent Analyst specialized in analyzing Text-to-SQL agent trajectories.
          Your goal is to distill generalizable, actionable insights from execution trajectories.
        reflection_user_prompt_template: |
          ### Input Context
          **1. User Query:**
          {query}

          **2. Agent Trajectory:**
          {trajectory}

          **3. Evaluation Outcome:**
          {outcome_status}
          {error_message}

          ---

          ### Output Format
          Output a valid JSON object:

          ```json
          {{
            "diagnosis_reasoning": "Analysis of success/failure factors...",
            "error_type": "Syntax Error | Logic Error | Schema Misunderstanding | Optimal Path | ...",
            "insight": "A generalizable rule or tip (under 50 words).",
            "tags": ["relevant_concept"]
          }}
          ```
    # ========== Reranker GRPO 训练 Callback ==========
    callback_reranker_grpo:
      name: reranker_grpo_training_callback
      custom_parameters:
        config_path: "./configs/components/rl/reranker_grpo.yaml"
  output_dir: outputs/reranker_grpo_usc4/{TIMESTAMP}
  sample_order: default

environment_config:
  use_task_client_flag: false

task_dict:
  db_bench:
    parameters:
      chat_history_item_factory:
        parameters:
          chat_history_item_dict_path: ./chat_history_items/previous_sample_utilization/db_bench.json
